name: Deploy Backend

on:
  push:
    branches: [main]
    paths: [backend/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push
        run: |
          gcloud builds submit backend/ \
            --tag us-central1-docker.pkg.dev/gk1408/brodersen-repo/backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy brodersen-backend \
            --image=us-central1-docker.pkg.dev/gk1408/brodersen-repo/backend:latest \
            --region=us-central1